name: Quest Plus authoring checks

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'web/editor/**'
      - 'build.gradle'
      - 'gradle/**'
      - '.github/workflows/authoring-checks.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'web/editor/**'
      - 'build.gradle'
      - 'gradle/**'
      - '.github/workflows/authoring-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    name: Quest Studio (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/editor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    name: Fabric server (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew build integrationTest --no-daemon --stacktrace
