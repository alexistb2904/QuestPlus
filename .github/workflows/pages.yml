name: Deploy React Quest Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/editor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production React site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web/editor
        run: npm install --no-audit --no-fund
      - name: Test, typecheck, and build
        working-directory: web/editor
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Verify static bundle
        run: |
          test -s web/editor/dist/index.html
          test -d web/editor/dist/assets
          test -s web/editor/dist/questplus-logo.png
          touch web/editor/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/editor/dist

  deploy:
    name: Deploy React app
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
