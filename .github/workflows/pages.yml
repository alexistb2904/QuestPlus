name: Deploy Quest Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/editor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Quest Studio
        run: node --test web/editor/tests/*.test.mjs

      - name: Package only public site assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for asset in index.html style.css editor.js inspector.js project.js zip.js; do
            test -s "web/editor/$asset"
            cp "web/editor/$asset" "_site/$asset"
          done
          touch _site/.nojekyll
          # The app uses relative module imports, so it works at /QuestPlus/
          # as well as a custom-domain root without rewriting asset paths.
          test -s _site/index.html
          test -s _site/editor.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
