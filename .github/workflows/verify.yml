name: Java 25 / Fabric compile
on:
  push:
    branches: [main, 'fix/native-first-person-tablet', 'feat/**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile mod and execute unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React and Vite
        working-directory: web/editor
        run: npm install --no-audit --no-fund
      - name: Typecheck, build and test React Quest Studio
        working-directory: web/editor
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Build Markdown documentation
        working-directory: docs-site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Exercise QuestPlus Hub security and publishing protocol
        working-directory: web/api
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Confirm no legacy Hub or source tree
        run: |
          test ! -d hub
          test ! -d src
          test -f client/src/main/resources/questplus.client.mixins.json
          test -f server/src/main/resources/fabric.mod.json
          test -f web/api/server.mjs
      - name: Upload test reports when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: questplus-test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
