services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      PORT: '8787'
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?Set HTTPS public URL}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:?Set Quest Studio origin}
      STUDIO_URL: ${STUDIO_URL:?Set full Quest Studio URL}
      HUB_SERVER_KEY: ${HUB_SERVER_KEY:?Set a 32+ character secret}
      HUB_DATA_DIR: /app/data/packs
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - questplus-packs:/app/data/packs
volumes:
  questplus-packs:
