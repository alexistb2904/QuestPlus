services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VITE_QUESTPLUS_HUB_URL: ${VITE_QUESTPLUS_HUB_URL:-}
        VITE_QUESTPLUS_DOCS_URL: ${VITE_QUESTPLUS_DOCS_URL:-}
    restart: unless-stopped
    mem_limit: ${HUB_MEMORY_LIMIT:-768m}
    environment:
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?Set the public HTTPS origin}
      HUB_DATA_DIR: /app/data/packs
      HUB_MAX_SESSIONS: ${HUB_MAX_SESSIONS:-128}
      HUB_MAX_STATE_BYTES: ${HUB_MAX_STATE_BYTES:-67108864}
      HUB_MAX_PACKS: ${HUB_MAX_PACKS:-256}
      HUB_MAX_PACK_BYTES: ${HUB_MAX_PACK_BYTES:-268435456}
    volumes:
      - questplus-packs:/app/data/packs
volumes:
  questplus-packs:
