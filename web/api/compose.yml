services:
  web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8787'
      HUB_BIND: '0.0.0.0'
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?Set HTTPS public URL}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-}
      STUDIO_URL: ${STUDIO_URL:-}
      HUB_SERVER_KEY: ${HUB_SERVER_KEY:?Set a 32+ character secret}
      HUB_DATA_DIR: /app/data/packs
      WEB_STATIC_DIR: /app/public
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - questplus-packs:/app/data/packs
volumes:
  questplus-packs:
