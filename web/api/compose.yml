services:
    web:
        build:
            context: ..
            dockerfile: api/Dockerfile
            args:
                VITE_QUESTPLUS_HUB_URL: ${VITE_QUESTPLUS_HUB_URL:-}
                VITE_QUESTPLUS_DOCS_URL: ${VITE_QUESTPLUS_DOCS_URL:-}
        restart: unless-stopped
        mem_limit: ${HUB_MEMORY_LIMIT:-768m}
        environment:
            PORT: "8787"
            HUB_BIND: "0.0.0.0"
            HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?Set HTTPS public URL}
            STUDIO_ORIGIN: ${STUDIO_ORIGIN:-}
            STUDIO_URL: ${STUDIO_URL:-}
            HUB_SERVER_KEY: ${HUB_SERVER_KEY:-}
            HUB_DATA_DIR: /app/data/packs
            WEB_STATIC_DIR: /app/public
            NODE_OPTIONS: --max-old-space-size=384
            HUB_MAX_SESSIONS: ${HUB_MAX_SESSIONS:-128}
            HUB_MAX_STATE_BYTES: ${HUB_MAX_STATE_BYTES:-67108864}
            HUB_MAX_PACKS: ${HUB_MAX_PACKS:-256}
            HUB_MAX_PACK_BYTES: ${HUB_MAX_PACK_BYTES:-268435456}
        ports:
            - "127.0.0.1:8787:8787"
        volumes:
            - questplus-packs:/app/data/packs
volumes:
    questplus-packs:
