
version = rootProject.version
group = rootProject.group
base.archivesName = "questplus-mc${name}"
def shared = { String path -> rootProject.file(path) }
def adapterId = rootProject.adapterId(project)
def otherTargets = rootProject.targets.findAll { it != project }

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly 'teamreborn:energy:5.0.0'
    compileOnly 'com.google.j2objc:j2objc-annotations:3.0.0'
    compileOnly('maven.modrinth:rei:rKsAE6bX') { transitive = false }
    compileOnly('maven.modrinth:jei:hif1VmML') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    main {
        java.setSrcDirs([shared('server/src/main/java'), shared('client/src/main/java'), shared('fabric/src/main/java'), 'src/main/java'])
        resources.setSrcDirs([shared('server/src/main/resources'), shared('client/src/main/resources'), shared('fabric/src/main/resources'), 'src/main/resources'])
    }
    test {
        java.setSrcDirs([shared('server/src/test/java'), shared('client/src/test/java'), shared('fabric/src/test/java'), 'src/test/java'])
        resources.setSrcDirs([shared('server/src/test/resources')])
    }
}

def exportAdapters = tasks.register('exportAdapters', Sync) {
    from(tasks.named('compileJava')) { include "dev/questplus/compat/${adapterId}/**" }
    from('src/main/resources') { include "questplus.${adapterId}.mixins.json" }
    into layout.buildDirectory.dir('adapter-export')
}
// Every run and JAR carries all targets' adapters, exactly like the universal JAR.
otherTargets.each { other ->
    sourceSets.main.output.dir(other.layout.buildDirectory.dir('adapter-export'), builtBy: "${other.path}:exportAdapters")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def resourceVersion = project.version
    def targets = rootProject.targetMetadata
    inputs.property 'version', resourceVersion
    inputs.property 'targets', targets
    rootProject.sharedResources(it)
    // Minecraft compatibility is generated from versions/*: never hand-edit it in fabric.mod.json.
    doLast {
        def metadata = new File(destinationDir, 'fabric.mod.json')
        def data = new groovy.json.JsonSlurper().parse(metadata)
        data.version = resourceVersion
        data.depends.minecraft = targets.values().collectMany { it.minecraft }
        // Lowest tested build overall. MinecraftTarget enforces each target's own minimum.
        data.depends['fabric-api'] = '>=' + targets.values()*.'fabric-api'.min { rootProject.versionKey(it) }
        targets.keySet().each { id ->
            data.mixins << "questplus.${id}.mixins.json".toString()
            data.entrypoints["questplus:${id}".toString()] = ["dev.questplus.compat.${id}.CommonAdapterImpl".toString()]
            data.entrypoints["questplus:${id}/client".toString()] = ["dev.questplus.compat.${id}.ClientAdapterImpl".toString()]
        }
        data.custom = (data.custom ?: [:]) + ['questplus:targets': targets]
        metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
    }
}

test {
    useJUnitPlatform()
    // Tests read sources and assets relative to mod/.
    workingDir = rootProject.projectDir
    systemProperty 'joml.nounsafe', 'true'
}

// Animation libraries are intentionally not embedded in release artifacts.
tasks.register('verifyNativeRenderer') {
    group = 'verification'
    // Inspect the actual artifact uploaded to Modrinth / CurseForge.
    dependsOn tasks.named('jar')
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { jar ->
            def entries = jar.entries().toList()*.name
            assert !entries.any { it.startsWith('META-INF/jars/') } : 'Standalone release JAR must not embed any external library'
            assert jar.getEntry('META-INF/neoforge.mods.toml') == null && !entries.any { it.startsWith('dev/questplus/platform/neoforge/') } : 'No NeoForge glue in the Fabric JAR'
            assert !jar.getInputStream(jar.getEntry('questplus.client.mixins.json')).getText('UTF-8').contains('TabletFaceCaptureMixin')
            // Every target ships its own native first-person hook.
            rootProject.targetMetadata.keySet().each { id ->
                def entry = jar.getEntry("questplus.${id}.mixins.json")
                assert entry != null : "Missing questplus.${id}.mixins.json"
                assert jar.getInputStream(entry).getText('UTF-8').contains('TabletNativeFirstPersonMixin') : id
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyNativeRenderer') }

ext.mixinConfigs = [shared('server/src/main/resources/questplus.mixins.json'),
                    shared('client/src/main/resources/questplus.client.mixins.json'),
                    file("src/main/resources/questplus.${adapterId}.mixins.json")]
apply from: rootProject.file('gradle/verify-mixins.gradle')

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'questplus-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Fabric API creates the gametest source set above. Use split source folders
// without creating a second mod or duplicating entrypoints.
sourceSets.named('gametest') {
    java.setSrcDirs([shared('server/src/gametest/java'), shared('client/src/gametest/java'), shared('fabric/src/gametest/java'), 'src/gametest/java'])
    resources.setSrcDirs([shared('server/src/gametest/resources'), shared('client/src/gametest/resources')])
}

// Loom cleans its default directory. Our overridden test world needs cleaning too.
tasks.named('deleteGameTestRunDir', Delete) {
    delete layout.buildDirectory.dir('gametest')
}

// Fabric's shared launch setup must not clean a running GameTest world for normal clients.
afterEvaluate {
    def acceptEula = tasks.named('acceptGameTestEula')
    tasks.named('configureLaunch') {
        setDependsOn(dependsOn.findAll { it != acceptEula })
    }
    tasks.named('runGameTest') { dependsOn acceptEula }
    tasks.named('runClientGameTest') { dependsOn acceptEula }
}

tasks.register('verifyGameTestLaunchIsolation') {
    group = 'verification'
    doLast {
        // Walk declared dependsOn only: resolving full task dependencies here would also resolve the
        // run classpath, which names the other targets' exportAdapters and deadlocks on their locks.
        def declared = { task ->
            task.dependsOn.collectMany { d ->
                if (d instanceof Task) return [d]
                if (d instanceof org.gradle.api.tasks.TaskProvider) return [d.get()]
                if (d instanceof CharSequence) return [tasks.findByPath(d.toString())].findAll()
                if (d instanceof Collection) return d.findAll { it instanceof Task }
                []
            }
        }
        def containsTask
        containsTask = { task, target, seen ->
            if (!seen.add(task)) return false
            task == target || declared(task).any { containsTask(it, target, seen) }
        }
        def cleanup = tasks.named('deleteGameTestRunDir').get()
        assert !containsTask(tasks.named('runClient').get(), cleanup, [] as Set) : 'Normal client must not delete GameTest worlds'
        ['runGameTest', 'runClientGameTest'].each { name ->
            assert containsTask(tasks.named(name).get(), cleanup, [] as Set) : "${name} must clean its test world"
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyGameTestLaunchIsolation') }

dependencies {
    gametestImplementation fabricApi.module('fabric-gametest-api-v1', project.fabric_version)
    gametestImplementation fabricApi.module('fabric-client-gametest-api-v1', project.fabric_version)
    // External energy runtime exists only in GameTests exercising modded battery targets.
    gametestImplementation 'teamreborn:energy:5.0.0'
    gametestRuntimeOnly 'teamreborn:energy:5.0.0'
    // Opt-in real content mods. Never part of the release or ordinary client runs.
    if (providers.gradleProperty('objectiveCompatibility').isPresent()) {
        gametestRuntimeOnly 'maven.modrinth:7vxePowz:dRScyUeE' // Farmer's Delight Refabricated
        gametestRuntimeOnly 'maven.modrinth:QivVPB8W:yeFv1Dnk' // The Graveyard
        gametestRuntimeOnly 'maven.modrinth:DhOXUfnP:uut3GStm' // Villagers Trading Plus
        gametestRuntimeOnly 'maven.modrinth:8BmcQJ2H:kSxHvs99' // GeckoLib
        gametestRuntimeOnly 'maven.modrinth:L6jvzao4:isnpTNbP' // Epic Knights
        gametestRuntimeOnly 'maven.modrinth:lhGA9TYQ:1pMaB6So' // Architectury
        gametestRuntimeOnly 'maven.modrinth:9s6osm5g:fg2uyxOW' // Cloth Config
        gametestRuntimeOnly 'maven.modrinth:3eMENr4V:QexrQWIs' // Tech Reborn (includes Reborn Core)
    }
}

processGametestResources {
    def compatibility = providers.gradleProperty('objectiveCompatibility').isPresent()
    inputs.property 'objectiveCompatibility', compatibility
    doLast {
        def metadata = destinationDir.toPath().resolve('fabric.mod.json').toFile()
        def data = new groovy.json.JsonSlurper().parse(metadata)
        if (compatibility) data.entrypoints['fabric-gametest'].addAll([
            'dev.questplus.fabric.ThirdPartyObjectivesGameTest',
            'dev.questplus.fabric.ResourceCompatibilityGameTest'
        ])
        metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
    }
}

// The newest target keeps the historical run/client and run/server worlds. Older targets get
// their own folders so a world is never opened by an older Minecraft.
def interactiveRunDir = { String side ->
    def dir = rootProject.file(project == rootProject.referenceTarget ? "../run/${side}" : "../run/${name}/${side}")
    projectDir.toPath().relativize(dir.toPath()).toString().replace('\\', '/')
}
loom {
    runs {
        client {
            runDir interactiveRunDir('client')
        }
        server {
            runDir interactiveRunDir('server')
        }
        gameTest {
            runDir 'build/gametest'
            vmArg '-Xmx1G'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath}"
            vmArg "-Dquestplus.integration.output=${layout.buildDirectory.file('integration-saves.json').get().asFile.absolutePath}"
            vmArg "-Dquestplus.integration.teams=${layout.buildDirectory.file('integration-teams.json').get().asFile.absolutePath}"
        }
        clientGameTest {
            if(providers.gradleProperty('boardClientTest').isPresent())vmArg '-Dquestplus.boardClientTest=true'
            if (providers.gradleProperty('questGiverClientTest').isPresent())
                vmArg '-Dquestplus.questGiverClientTest=true'
            if (providers.gradleProperty('relayClientTest').isPresent())
                vmArg '-Dquestplus.relayClientTest=true'
            if (providers.gradleProperty('worldBlocksClientTest').isPresent())
                vmArg '-Dquestplus.worldBlocksClientTest=true'
            if (providers.gradleProperty('teamClientTest').isPresent())
                vmArg '-Dquestplus.teamClientTest=true'
        }
    }
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Run real dedicated-server gameplay tests and verify final JSON saves after shutdown.'
    dependsOn tasks.named('runGameTest')
    doLast {
        rootProject.verifyIntegration(layout.buildDirectory.file('gametest-results.xml').get().asFile,
            layout.buildDirectory.file('integration-saves.json').get().asFile,
            layout.buildDirectory.file('integration-teams.json').get().asFile)
    }
}

// One interactive client/server at a time: the newest target, unless -Pmc picks another or
// the task path names this target (./gradlew :26.1:runClient). Test runs cover every target.
def requested = gradle.startParameter.taskNames.any { it.startsWith("${path}:") }
def interactive = project == rootProject.referenceTarget || rootProject.targets.size() == 1 || requested
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach { onlyIf { interactive } }
