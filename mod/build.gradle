plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.18.4' apply false
}

version = project.mod_version
group = project.maven_group

ext.versionKey = { String v -> v.tokenize('+')[0].tokenize('.').collect { it.padLeft(6, '0') }.join('.') }
ext.targets = subprojects.sort { versionKey(it.name) }
ext.referenceTarget = targets.last()
ext.adapterId = { Project target -> 'mc' + target.name.replace('.', '_') }
ext.targetMetadata = targets.collectEntries { target ->
    [(adapterId(target)): [minecraft: target.validated_minecraft.tokenize(','), 'fabric-api': target.fabric_version]]
}

// ASM is on this script's classpath (via Loom) but not on applied scripts', so share a reader.
ext.classNode = { byte[] bytes ->
    def node = new org.objectweb.asm.tree.ClassNode()
    new org.objectweb.asm.ClassReader(bytes).accept(node, org.objectweb.asm.ClassReader.SKIP_CODE)
    node
}

// Several game instances at once starve GameTest tick budgets: one target's game runs at a time.
abstract class GameTestSlot implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}
def gameTestSlot = gradle.sharedServices.registerIfAbsent('questplusGameTests', GameTestSlot) { maxParallelUsages = 1 }

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply from: rootProject.file('gradle/minecraft-target.gradle')
    tasks.matching { it.name in ['runGameTest', 'runClientGameTest'] }.configureEach { usesService(gameTestSlot) }
}

def allTargets = !gradle.startParameter.projectProperties.mc
def releaseJar = tasks.register('universalJar', Copy) {
    group = 'build'
    description = allTargets ? 'Universal JAR for every validated Minecraft target.'
        : 'Single-target JAR (-Pmc): only the selected Minecraft target is declared.'
    from(referenceTarget.tasks.named('jar'))
    into layout.buildDirectory.dir('libs')
    rename { allTargets ? "questplus-${version}.jar" : "questplus-${version}+mc${referenceTarget.name}.jar" }
}
tasks.named('assemble') { dependsOn releaseJar }

def verifyShared = tasks.register('verifySharedBytecode') {
    group = 'verification'
    dependsOn targets.collect { "${it.path}:compileJava" }
    doLast {
        def linkable = { File file ->
            def node = new org.objectweb.asm.tree.ClassNode()
            new org.objectweb.asm.ClassReader(file.bytes).accept(node, 0)
            node.innerClasses.each { if (!it.name.startsWith('dev/questplus/')) it.access = 0 }
            def writer = new org.objectweb.asm.ClassWriter(0)
            node.accept(writer)
            writer.toByteArray()
        }
        def classesOf = { Project target ->
            def root = target.tasks.named('compileJava').get().destinationDirectory.get().asFile
            target.fileTree(root) { exclude 'dev/questplus/compat/mc*/**' }.files.collectEntries {
                [(root.toPath().relativize(it.toPath()).toString().replace(File.separator, '/')): it]
            }
        }
        def reference = classesOf(referenceTarget)
        targets.findAll { it != referenceTarget }.each { target ->
            def other = classesOf(target)
            def differing = (reference.keySet() + other.keySet()).findAll { name ->
                !reference[name] || !other[name] || linkable(reference[name]) != linkable(other[name])
            }.sort()
            if (differing) throw new GradleException("Shared classes differ between Minecraft ${referenceTarget.name} and ${target.name}; " +
                "move the version-specific call into dev.questplus.compat adapters:\n  " + differing.join('\n  '))
        }
        logger.lifecycle("Shared bytecode identical on ${targets*.name.join(', ')} (${reference.size()} classes)")
    }
}
tasks.named('check') { dependsOn verifyShared }
