// Run with: gradlew runClientGameTest -I scripts/recipe-viewer-test.gradle
// Uses the JEI already installed in the development client. Isolates the test world.
allprojects {
    afterEvaluate {
        // Profiles pin 26.3 mods: configure the newest Minecraft target only, never launch the others.
        if (project != rootProject.findProperty('referenceTarget')) {
            tasks.matching { it.name.startsWith('run') }.configureEach { enabled = false }
            return
        }
        loom.runs.clientGameTest {
            runDir rootProject.file('build/recipe-return').absolutePath
            vmArg '-Dquestplus.recipeReturn=true'
            vmArg '-Xmx2G'
        }
        tasks.named('deleteGameTestRunDir') {
            doLast {
                def jei = rootProject.fileTree('run/client/mods') { include '*jei*.jar' }
                if (jei.empty) throw new GradleException('Install JEI in run/client/mods before running this test')
                copy { from jei; into rootProject.file('build/recipe-return/mods') }
            }
        }
    }
}
