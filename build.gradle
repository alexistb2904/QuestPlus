plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Minecraft 26.3 uses Loom's non-remapping plugin: use standard 'implementation'
    // for PAL and FP PAL (the legacy modImplementation configuration is absent).
    // Fabric 26.3: Player Animation Library and First Person PAL Expansion.
    implementation 'maven.modrinth:ha1mEyJS:xJ30QmpE'
    implementation 'curse.maven:first-person-pal-expansion-1758160:9329319'
    implementation 'de.marhali:json5-java:3.0.0'
    include 'de.marhali:json5-java:3.0.0'
    // Shared transactional item-energy API for Fabric batteries; shipped in the universal JAR.
    implementation 'teamreborn:energy:5.0.0'
    include 'teamreborn:energy:5.0.0'
    compileOnly 'com.google.j2objc:j2objc-annotations:3.0.0'
    // Optional client recipe viewers: compile against their APIs without bundling either mod.
    compileOnly('maven.modrinth:rei:rKsAE6bX') { transitive = false }
    compileOnly('maven.modrinth:jei:hif1VmML') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// ONE universal Fabric JAR compiled from the client and server trees.
// Package names stay unchanged for Fabric entrypoints, mixins and saved data.
sourceSets {
    main {
        java.setSrcDirs(['server/src/main/java', 'client/src/main/java'])
        resources.setSrcDirs(['server/src/main/resources', 'client/src/main/resources'])
    }
    test {
        java.setSrcDirs(['server/src/test/java', 'client/src/test/java'])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def resourceVersion = project.version
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') { expand version: resourceVersion }
    // Catalogue authored once for both the server JAR and Quest Studio.
    from('web/editor/src/data') {
        include 'challenge-catalogue.json', 'equipment-catalogue.json'
        into 'defaults/catalogue'
    }
}

test {
    useJUnitPlatform()
    systemProperty 'joml.nounsafe', 'true'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'questplus-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Fabric API creates the gametest source set above. Use split source folders
// without creating a second mod or duplicating entrypoints.
sourceSets.named('gametest') {
    java.setSrcDirs(['server/src/gametest/java', 'client/src/gametest/java'])
    resources.setSrcDirs(['server/src/gametest/resources', 'client/src/gametest/resources'])
}

dependencies {
    gametestImplementation fabricApi.module('fabric-gametest-api-v1', project.fabric_version)
    gametestImplementation fabricApi.module('fabric-client-gametest-api-v1', project.fabric_version)
}

loom {
    runs {
        client {
            runDir 'run/client'
        }
        server {
            runDir 'run/server'
        }
        gameTest {
            runDir 'build/gametest'
            vmArg '-Xmx1G'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath}"
            vmArg "-Dquestplus.integration.output=${layout.buildDirectory.file('integration-saves.json').get().asFile.absolutePath}"
            vmArg "-Dquestplus.integration.teams=${layout.buildDirectory.file('integration-teams.json').get().asFile.absolutePath}"
        }
    }
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Run real dedicated-server gameplay tests and verify final JSON saves after shutdown.'
    dependsOn tasks.named('runGameTest')
    doLast {
        def expected = new groovy.json.JsonSlurper().parse(layout.buildDirectory.file('integration-saves.json').get().asFile)
        assert expected.players.size() >= 140
        expected.players.each { uuid ->
            def saved = new groovy.json.JsonSlurper().parse(new File(expected.directory, "${uuid}.json"))
            assert saved.schemaVersion == 2
            assert saved.quests['questplus:survival/logs'].completed
        }
        def recipient = new groovy.json.JsonSlurper().parse(new File(expected.directory, "${expected.recipient}.json"))
        assert recipient.claims['questplus:survival/logs'] == 'delivered'
        def teamExpected = new groovy.json.JsonSlurper().parse(layout.buildDirectory.file('integration-teams.json').get().asFile)
        def memberA = new groovy.json.JsonSlurper().parse(new File(teamExpected.root, "players/${teamExpected.a}.json"))
        def memberB = new groovy.json.JsonSlurper().parse(new File(teamExpected.root, "players/${teamExpected.b}.json"))
        def team = new groovy.json.JsonSlurper().parse(new File(teamExpected.root, "teams/${teamExpected.team}.json"))
        assert memberA.teamId == null && memberB.teamId == null
        assert memberA.quests['questplus:team_integration'].completed && memberB.quests['questplus:team_integration'].completed
        assert memberA.claims['questplus:team_integration'] == 'delivered'
        assert memberB.entitlements['questplus:team_integration'] != null
        assert team.disbanded && team.members.empty
        logger.lifecycle("Quest Plus shutdown saves verified: ${expected.players.size()} UUIDs and durable reward ledger")
    }
}
